name: productivity

services:
  app:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_ROBOT_LINK_URL: ${VITE_ROBOT_LINK_URL:-}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: "4173"
      SUPABASE_URL: ${VITE_SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
    volumes:
      - app_data:/app/.data
    # Only Caddy can reach this port; no public app port bypasses HTTPS.
    expose:
      - "4173"
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in deploy/vultr/.env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in deploy/vultr/.env}
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  app_data:
  caddy_data:
  caddy_config:
