name: Build and test ProdPet

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: prodpet
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: prodpet_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U prodpet -d prodpet_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      RAILS_ENV: test
      TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql://prodpet:test-only-password@localhost:5432/prodpet_test' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          working-directory: backend
          bundler-cache: true
      - run: ruby bin/rails db:prepare
      - run: ruby bin/rails zeitwerk:check
      - run: ruby bin/rails test
      - name: Build and smoke test the Rails container
        if: matrix.database == 'sqlite'
        working-directory: .
        run: |
          docker build -f backend/Dockerfile -t prodpet-api:test .
          docker run -d --name prodpet-api-test -e SECRET_KEY_BASE=ci-only-placeholder-secret-for-health-check -p 127.0.0.1:18000:8000 prodpet-api:test
          trap 'docker logs prodpet-api-test; docker rm -f prodpet-api-test' EXIT
          curl --retry 30 --retry-all-errors --retry-delay 1 --fail http://127.0.0.1:18000/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18000/users/11111111-1111-4111-8111-111111111111/stats)" = 401
