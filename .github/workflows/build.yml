name: Build and test ProdPet

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: prodpet
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: prodpet_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U prodpet -d prodpet_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      RAILS_ENV: test
      TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql://prodpet:test-only-password@localhost:5432/prodpet_test' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          working-directory: backend
          bundler-cache: true
      - run: ruby bin/rails db:prepare
      - run: ruby bin/rails zeitwerk:check
      - run: ruby bin/rails test
      - name: Resolve portable dependency lock
        if: matrix.database == 'sqlite'
        run: |
          bundle lock --add-platform x86_64-linux aarch64-linux arm64-darwin x64-mingw-ucrt
          cat Gemfile.lock
