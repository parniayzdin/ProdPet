default: &default
  adapter: sqlite3
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  timeout: 5000

development:
  <<: *default
  database: prodpet.db

# DATABASE_URL is deliberately ignored for test; use TEST_DATABASE_URL for PostgreSQL CI.
test:
  <<: *default
<% if ENV["TEST_DATABASE_URL"].to_s.empty? %>
  url: "sqlite3:<%= File.expand_path("../tmp/test.sqlite3", __dir__) %>"
<% else %>
  url: <%= ENV.fetch("TEST_DATABASE_URL").inspect %>
<% end %>

production:
  <<: *default
  database: storage/prodpet.sqlite3
